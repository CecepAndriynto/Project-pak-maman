<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sistem Autentikasi</title>
    <link rel="stylesheet" href="Assets/login.css">
</head>
<body>
    <main class="auth-card">
        <div class="auth-header">
            <h1>Buat Akun Baru</h1>
            <p>Daftar untuk mulai menggunakan layanan kami.</p>
        </div>

        <form class="auth-form" action="#" method="post">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email Anda" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="konfirmasi-password">Konfirmasi Password</label>
                <input type="password" id="konfirmasi-password" name="konfirmasi-password" placeholder="Ulangi password Anda" autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="button">Daftar</button>
        </form>

        <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </main>
</body>
</html>
