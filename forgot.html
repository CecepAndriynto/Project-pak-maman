<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Sistem Autentikasi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-card">
        <div class="auth-header">
            <h1>Lupa Password?</h1>
            <p>Masukkan email Anda untuk menerima link reset password.</p>
        </div>

        <form class="auth-form" action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email Anda" autocomplete="email" required>
            </div>

            <button type="submit" class="button">Kirim Link Reset</button>
        </form>

        <p class="auth-footer"><a href="index.html">← Kembali ke Login</a></p>
    </main>
</body>
</html>
