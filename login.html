<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Sistem Autentikasi</title>
    <link rel="stylesheet" href="Assets/login.css">
</head>
<body>
    <main class="auth-card">
        <div class="auth-header">
            <h1>Selamat Datang</h1>
            <p>Masuk ke akun Anda untuk melanjutkan.</p>
        </div>

        <form class="auth-form" action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email Anda" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password Anda" autocomplete="current-password" minlength="8" required>
            </div>

            <div class="form-options">
                <label class="checkbox-label" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Ingat saya</span>
                </label>
                <a href="forgot.html">Lupa password?</a>
            </div>

            <button type="submit" class="button">Masuk</button>
        </form>

        <p class="auth-footer">Belum punya akun? <a href="register.html">Daftar</a></p>
    </main>
</body>
</html>
